# Manually deploy a pre-built Maven site to GitHub Pages.
#
# The regular site deployment happens during a release; this workflow makes it
# possible to (re)publish the documentation without cutting a release: build
# the site locally with `mvn site`, push the content of target/site to a
# branch (e.g. site-content), then run this workflow against that branch.
name: Deploy Pre-built Site to GitHub Pages

on:
  workflow_dispatch:
    inputs:
      siteRef:
        description: "Branch or ref whose root contains the built site (content of target/site)"
        required: true
        default: "site-content"

permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, but do NOT cancel in-progress runs as
# we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.siteRef }}

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
