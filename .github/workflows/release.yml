# This workflow releases the project on repo.metricshub.com
# and prepare a new development version

name: Release to repo.metricshub.com
run-name: Release v${{ inputs.releaseVersion }} to repo.metricshub.com

on:
  workflow_dispatch:
    inputs:
      releaseVersion:
        description: "Release version"
        required: true
        default: ""
      developmentVersion:
        description: "New SNAPSHOT version"
        required: true
        default: ""

jobs:
  release:
    uses: metricshub/workflows/.github/workflows/maven-metricshub-release.yml@v9
    with:
      releaseVersion: ${{ inputs.releaseVersion }}
      developmentVersion: ${{ inputs.developmentVersion }}
      jdkVersion: "25"
    secrets: inherit
