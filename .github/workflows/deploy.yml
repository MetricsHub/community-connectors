# When main branch is updated:
# - Build
# - Deploy the artifacts to repo.metricshub.com
# - Update the dependency graph
name: Maven Deploy

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    uses: metricshub/workflows/.github/workflows/maven-metricshub-deploy.yml@v9
    with:
      jdkVersion: "25"
    secrets: inherit
