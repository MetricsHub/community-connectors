# ██╗     ██╗███╗   ██╗██╗   ██╗██╗  ██╗
# ██║     ██║████╗  ██║██║   ██║╚██╗██╔╝
# ██║     ██║██╔██╗ ██║██║   ██║ ╚███╔╝
# ██║     ██║██║╚██╗██║██║   ██║ ██╔██╗
# ███████╗██║██║ ╚████║╚██████╔╝██╔╝ ██╗
# ╚══════╝╚═╝╚═╝  ╚═══╝ ╚═════╝ ╚═╝  ╚═╝
# https://manytools.org/hacker-tools/ascii-banner/ (ANSI Shadow)

# We're implementing the OpenTelemetry semantic conventions for system metrics.
extends:
- ../../semconv/System

# Connector properties
connector:
  displayName: Linux System
  platforms: Linux
  reliesOn: Linux commands and /proc
  information: Collects system metrics from Linux hosts using the /proc filesystem and various Linux commands. Implements the OpenTelemetry semantic conventions for system metrics.
  detection:
    appliesTo:
    - linux
    criteria:
    # START SNIPPET: commandLineCriterion
    - type: commandLine
      commandLine: /usr/bin/uname -o 2>/dev/null || /bin/uname -o 2>/dev/null || { s=`/usr/bin/uname -s 2>/dev/null || /bin/uname -s 2>/dev/null || uname -s`; [ "$s" = "Linux" ] && echo GNU/Linux; }
      expectedResult: GNU/Linux
      errorMessage: Not a Linux host.
    # END SNIPPET: commandLineCriterion
    tags: [ system, linux ]

# The commands of the tools that %{SUDO:...} elevates, when the configuration enables sudo for them
sudoCommands:
- dmesg
- du
- find
- journalctl
- kill
- ls
- lsof
- shutdown
- ss
- systemctl
- tail

# Run the collection commands once per cycle. Commands that are common to
# modern and legacy Linux are executed once. Where the legacy command differs,
# the modern command is tried first and the legacy command is executed only if
# the modern command fails.
beforeAll:
  systemSnapshot:
    type: commandLine
    forceSerialization: true
    commandLine: |
      export LC_ALL=C
      echo '##NET##'
      if ipLinkOutput=$(/usr/sbin/ip -s link 2>/dev/null); then
        printf '%s\n' "$ipLinkOutput"
      else
        cat /proc/net/dev
      fi

      echo '##CPU##'; cat /proc/stat

      echo '##MEM##'
      if lsmemOutput=$(/usr/bin/lsmem -b 2>/dev/null); then
        printf '%s\n' "$lsmemOutput"
      fi
      cat /proc/meminfo

      echo '##SWAPS##'; cat /proc/swaps

      echo '##VMSTAT##'; cat /proc/vmstat

      echo '##SYSCLASSNET##'
      for p in /sys/class/net/*; do [ -e "$p/device" ] && printf '%s\n' "${p##*/}"; done

      echo '##LINKSPEED##'
      for iface in `ls /sys/class/net`; do
        speed=$(cat "/sys/class/net/$iface/speed" 2>/dev/null)
        sysfsSpeed="$speed"

        # Legacy fallback: some old kernels/drivers do not expose
        # /sys/class/net/<iface>/speed.
        case "$speed" in
          ''|-1|*[!0-9]*)
            ethtoolOutput=""

            if [ -x /sbin/ethtool ]; then
              ethtoolOutput=$(/sbin/ethtool "$iface" 2>/dev/null)
            elif [ -x /usr/sbin/ethtool ]; then
              ethtoolOutput=$(/usr/sbin/ethtool "$iface" 2>/dev/null)
            fi

            speed=$(printf '%s\n' "$ethtoolOutput" | sed -n 's/^[[:space:]]*Speed:[[:space:]]*\([0-9][0-9]*\)Mb\/s.*$/\1/p')
            
            if [ -z "$speed" ]; then
              if [ "$sysfsSpeed" = "-1" ]; then
                speed=-1
              else
                # Preserve unknown speed when neither sysfs nor ethtool provides a valid value.
                speed=""
              fi
            fi
        esac

        echo "$iface;$speed"
      done

      echo '##DISK##'; cat /proc/diskstats

      echo '##OS##'
      n=""
      v=""
      if [ -r /etc/os-release ]; then
        . /etc/os-release
        n="$NAME"
        v="$VERSION"
      fi
      [ -z "$n" ] && n=`head -n1 /etc/redhat-release 2>/dev/null`
      k=`/usr/bin/uname -r 2>/dev/null || /bin/uname -r 2>/dev/null || uname -r`
      u=`cut -d. -f1 /proc/uptime`
      echo "$n;$v;$k;$u"

# Linux monitors
monitors:

  # CPUs
  cpu:
    simple:
      type: multiInstance
      sources:
        cpuInfo:
          # cpuId;user;nice;system;idle;iowait
          type: copy
          from: "${source::beforeAll.systemSnapshot}"
          computes:
          - type: awk
            script: |
              /^##CPU##$/ { insec = 1; next }
              /^##[A-Z_]+##$/ { if (insec) exit; next }
              insec && /^cpu[0-9]/ {
                sub("cpu","");
                print $1 ";" $2 / 100 ";" $3 / 100 ";" $4 / 100 ";" $5 / 100 ";" $6 / 100
              }
            separators: ;
      mapping:
        source: ${source::cpuInfo}
        attributes:
          id: $1
          name: ${awk::sprintf("%s %s", "cpu", $1)}
          system.cpu.logical_number: $1
        metrics:
          system.cpu.utilization{system.cpu.state="user"}: rate($2)
          system.cpu.utilization{system.cpu.state="nice"}: rate($3)
          system.cpu.utilization{system.cpu.state="system"}: rate($4)
          system.cpu.utilization{system.cpu.state="idle"}: rate($5)
          system.cpu.utilization{system.cpu.state="io_wait"}: rate($6)
          system.cpu.time{system.cpu.state="user"}: $2
          system.cpu.time{system.cpu.state="nice"}: $3
          system.cpu.time{system.cpu.state="system"}: $4
          system.cpu.time{system.cpu.state="idle"}: $5
          system.cpu.time{system.cpu.state="io_wait"}: $6

  # Memory
  memory:
    simple:
      sources:
        memoryInfo:
          # memSystem
          type: copy
          from: "${source::beforeAll.systemSnapshot}"
          computes:
          - type: awk
            script: ${file::memory.awk}
            separators: ;
      mapping:
        source: ${source::memoryInfo}
        attributes:
          id: memory_usage
        metrics:
          system.memory.limit: $1
          system.memory.usage{system.memory.state="free"}: $2
          system.memory.usage{system.memory.state="used"}: $3
          system.memory.usage{system.memory.state="buffers"}: $4
          system.memory.usage{system.memory.state="cached"}: $5
          system.memory.utilization{system.memory.state="free"}: $6
          system.memory.utilization{system.memory.state="used"}: $7
          system.memory.utilization{system.memory.state="buffers"}: $8
          system.memory.utilization{system.memory.state="cached"}: $9

  # Swap (paging)
  paging:
    keys: [system.device]
    simple:
      sources:
        # Get swap usage from /proc/swaps
        swaps:
          type: copy
          from: "${source::beforeAll.systemSnapshot}"
          computes:
          # Output: Path;Free;Used;%Free;%Used
          - type: awk
            script: ${file::swap.awk}
            separators: ;
      mapping:
        source: ${source::swaps}
        attributes:
          id: $1
          system.device: $1
        metrics:
          system.paging.usage{system.paging.state="free"}: $2
          system.paging.usage{system.paging.state="used"}: $3
          system.paging.utilization{system.paging.state="free"}: $4
          system.paging.utilization{system.paging.state="used"}: $5

  # More swap (activity)
  paging_activity:
    simple:
      sources:
        # Get swap activity from /proc/vmstat
        swapActivity:
          type: copy
          from: "${source::beforeAll.systemSnapshot}"
          computes:
          # Output: pgfault;pgmajfault;pswpin;pswpout
          - type: awk
            script: ${file::swap-activity.awk}
            separators: ;
      mapping:
        source: ${source::swapActivity}
        attributes:
          id: swap
        metrics:
          system.paging.faults{system.paging.type="minor"}: $1
          system.paging.faults{system.paging.type="major"}: $2
          system.paging.operations{system.paging.direction="in"}: $3
          system.paging.operations{system.paging.direction="out"}: $4

  # Network
  network:
    simple:
      sources:
        # Parse either ip -s link or /proc/net/dev from the network section.
        ipLink:
          # Interface;MTU;State;RX_bytes;RX_packets;RX_errors;RX_dropped;RX_missed;RX_mcast;TX_bytes;TX_packets;TX_errors;TX_dropped;TX_carrier;TX_collsns;
          type: copy
          from: "${source::beforeAll.systemSnapshot}"
          computes:
          - type: awk
            script: ${file::network.awk}
            separators: ;

        # Use the sysfs filesystem to filter out virtual interfaces
        sysClassNet:
          # Interface;
          type: copy
          from: "${source::beforeAll.systemSnapshot}"
          computes:
          - type: awk
            script: |
              /^##SYSCLASSNET##$/ { insec = 1; next }
              /^##[A-Z_]+##$/ { if (insec) exit; next }
              insec { print }
            separators: ;

        # Use the sysfs filesystem to get the link speed of each interface
        linkSpeed:
          # Interface;SpeedMbps
          # Note: The speed is in Mbps, so we need to convert it to bytes per second
          type: copy
          from: "${source::beforeAll.systemSnapshot}"
          computes:
          - type: awk
          # Replace Network interfaces with a negative value by an empty string.
            script: |
              BEGIN { FS=";"; OFS=";" }
              /^##LINKSPEED##$/ { insec = 1; next }
              /^##[A-Z_]+##$/ { if (insec) exit; next }
              insec { if (($2 + 0) == -1) $2 = ""; print }
            separators: ;
          # Convert speed from Mbps to bytes per second
          # Interface;SpeedBytesPerSecond
          - type: multiply
            value: 125000
            column: 2

        # Now join the three sources together
        networkTempJoin:
          # Interface;MTU;State;RX_bytes;RX_packets;RX_errors;RX_dropped;RX_missed;RX_mcast;TX_bytes;TX_packets;TX_errors;TX_dropped;TX_carrier;TX_collsns;Interface;
          type: tableJoin
          leftTable: ${source::ipLink}
          rightTable: ${source::sysClassNet}
          leftKeyColumn: 1
          rightKeyColumn: 1
        networkAll:
          # Interface;MTU;State;RX_bytes;RX_packets;RX_errors;RX_dropped;RX_missed;RX_mcast;TX_bytes;TX_packets;TX_errors;TX_dropped;TX_carrier;TX_collsns;Interface;Interface;SpeedBytesPerSecond
          type: tableJoin
          leftTable: ${source::networkTempJoin}
          rightTable: ${source::linkSpeed}
          leftKeyColumn: 1
          rightKeyColumn: 1

      mapping:
        source: ${source::networkAll}
        attributes:
          id: $1
          network.interface.name: $1
        metrics:
          system.network.dropped{network.io.direction="transmit"}: $13
          system.network.dropped{network.io.direction="receive"}: $7
          system.network.packets{network.io.direction="transmit"}: $11
          system.network.packets{network.io.direction="receive"}: $5
          system.network.errors{network.io.direction="transmit"}: $12
          system.network.errors{network.io.direction="receive"}: $6
          system.network.io{network.io.direction="transmit"}: $10
          system.network.io{network.io.direction="receive"}: $4
          system.network.bandwidth.limit: $18

  # Physical disks
  physical_disk:
    simple:
      type: multiInstance
      sources:
        physicalDiskActivity:
        #OperationsIORead;OperationsIOWrite;OperationsRead;OperationsWrite;MergedRead;MergedWrite;OperationTimeRead;OperationTimeWrite;IOTime
          type: copy
          from: "${source::beforeAll.systemSnapshot}"
          computes:
          - type: awk
            script: |
              /^##DISK##$/ { insec = 1; next }
              /^##[A-Z_]+##$/ { if (insec) exit; next }
              insec && $3 ~ /^([shv]d[a-z]|xvd[a-z]+|nvme[0-9]+n[0-9]+|mmcblk[0-9]+(p[0-9]+)?)$/ {
                print $3 ";" $6*512 ";" $10*512 ";" $4 ";" $8 ";" $5 ";" $9 ";" $7/1000 ";" $11/1000 ";" $13/1000
              }
            separators: ;
      mapping:
        source: ${source::physicalDiskActivity}
        attributes:
          id: $1
          system.device: $1
        metrics:
          system.disk.io{disk.io.direction="read"}: $2
          system.disk.io{disk.io.direction="write"}: $3
          system.disk.operations{disk.io.direction="read"}: $4
          system.disk.operations{disk.io.direction="write"}: $5
          system.disk.merged{disk.io.direction="read"}: $6
          system.disk.merged{disk.io.direction="write"}: $7
          system.disk.operation_time{disk.io.direction="read"}: $8
          system.disk.operation_time{disk.io.direction="write"}: $9
          system.disk.io_time: $10

  # Filesystems
  file_system:
    simple:
      type: multiInstance
      sources:
        fileSystemInfo:
          # filesystem;mountpoint;type;used;available
          type: commandLine
          commandLine: |
            export LC_ALL=C
            if dfOutput=$(/usr/bin/df -B1 --output=source,target,fstype,used,avail,size 2>/dev/null); then
              printf '%s\n' "$dfOutput"
            elif dfOutput=$(/usr/bin/df -k -P -T 2>/dev/null); then
              printf '%s\n' "$dfOutput"
            elif dfOutput=$(/bin/df -k -P -T 2>/dev/null); then
              printf '%s\n' "$dfOutput"
            elif dfOutput=$(df -k -P -T 2>/dev/null); then
              printf '%s\n' "$dfOutput"
            fi
          computes:
          - type: awk
            script: ${file::filesystem.awk}
            separators: ;
      mapping:
        source: ${source::fileSystemInfo}
        attributes:
          id: $1
          system.device: $1
          system.filesystem.mountpoint: $2
          system.filesystem.type: $3
        metrics:
          system.filesystem.usage{system.filesystem.state="used"}: $4
          system.filesystem.usage{system.filesystem.state="free"}: $5
          system.filesystem.usage{system.filesystem.state="reserved"}: $8
          system.filesystem.utilization{system.filesystem.state="used"}: $6
          system.filesystem.utilization{system.filesystem.state="free"}: $7
          system.filesystem.utilization{system.filesystem.state="reserved"}: $9

  # Some system information, including uptime
  system:
    simple:
      sources:
        # Distribution;Version;Kernel
        osInformation:
          type: copy
          from: "${source::beforeAll.systemSnapshot}"
          computes:
          - type: awk
            script: |
              /^##OS##$/ { insec = 1; next }
              /^##[A-Z_]+##$/ { if (insec) exit; next }
              insec { print }
            separators: ;
      mapping:
        source: ${source::osInformation}
        attributes:
          id: $3
          name: $1
          version: $2
          os_version: $3
        metrics:
          system.uptime: $4

# Tools an AI assistant runs through the MetricsHub MCP server
tools:

  processes:
    description: Lists every process with its PID, parent PID, user, CPU percentage over the last second (100 for one full CPU), memory percentage, resident memory in KiB, elapsed time, state and command line. Use it when the host is slow or short of memory, to find the processes that use the most CPU or memory, then Linux_processDetails or Linux_killProcess on a PID.
    sources:
      processes:
        type: commandLine
        # The CPU time of each process (utime and stime of /proc/<pid>/stat) one second apart: the pcpu of ps is an
        # average over the life of the process, which hides a long-running process that just started to spin
        commandLine: |
          getconf CLK_TCK 2>/dev/null; echo ---
          cat /proc/[0-9]*/stat 2>/dev/null; echo ---
          sleep 1
          cat /proc/[0-9]*/stat 2>/dev/null; echo ---
          ps -e -o pid=,ppid=,user:32=,pmem=,rss=,etime=,stat=,args= 2>&1
        computes:
        # pid;ppid;user;cpuPercent;memoryPercent;residentKiB;elapsed;state;command
        # The fields of /proc/<pid>/stat counted after the process name, which may hold spaces and parentheses
        - type: awk
          script: |
            BEGIN { hz = 100 }
            $0 == "---" { phase++; next }
            phase == 0 { hz = $1; next }
            phase < 3 {
              pid = $1; sub(/^.*\) /, "")
              if (phase == 1) first[pid] = $12 + $13
              else if (pid in first) cpu[pid] = ($12 + $13 - first[pid]) * 100 / hz
              next
            }
            {
              command = $8; for (i = 9; i <= NF; i++) command = command " " $i
              gsub(/;/, ",", command)
              printf "%s;%s;%s;%.1f;%s;%s;%s;%s;%s\n", $1, $2, $3, cpu[$1] + 0, $4, $5, $6, $7, command
            }
    result:
      source: ${source::processes}
      columns: [ pid, ppid, user, cpuPercent, memoryPercent, residentKiB, elapsed, state, command ]

  fileSystemUsage:
    description: Shows the space and the inodes used on each mounted file system. Use it when a write fails with "No space left on device", which a file system out of inodes also reports while it has free space.
    sources:
      df:
        type: commandLine
        # Snap packages mount read-only squashfs images that are always full
        commandLine: df -hTP -x squashfs 2>&1; echo; df -iP -x squashfs 2>&1
    result:
      source: ${source::df}

  largestFiles:
    description: Lists the directories and files under a path that take at least a given size, with their size. Only the file system of the path is scanned. Use it after Linux_fileSystemUsage to find what fills a file system. On a large file system, it can take a few minutes.
    parameters:
      path:
        description: Absolute path of the directory to scan, e.g. /var
        required: true
        # An absolute path whose names start with a letter, a digit or _: no "..", no option
        pattern: '/|(/[A-Za-z0-9_][A-Za-z0-9_.@-]*)+'
      minimumMegabytes:
        type: integer
        description: The size from which a directory or a file is listed, in megabytes
        default: 100
        pattern: '[1-9][0-9]{0,5}'
    sources:
      du:
        type: commandLine
        commandLine: "%{SUDO:du} du -xah -t ${param::minimumMegabytes}M -- '${esc(bash)::param::path}' 2>/dev/null"
        # du reads the whole tree
        timeout: 300
    result:
      source: ${source::du}

  deletedOpenFiles:
    description: Lists the deleted files that processes still hold open, with the process and the size. Their space is only freed when the process closes them or stops. Use it when Linux_fileSystemUsage shows a full file system and Linux_largestFiles finds less than what is used. Without lsof, it needs root or sudo for find to see the processes of other users.
    # Two sources, as a command line elevates a single command
    sources:
      lsof:
        type: commandLine
        # Not the deleted libraries mapped in memory (mem), left behind by updates: they take no space
        commandLine: "if command -v lsof >/dev/null 2>&1; then %{SUDO:lsof} lsof -nP +L1 -a -d '^mem' 2>&1; fi"
      proc:
        type: commandLine
        # Without lsof, the file descriptors of /proc that point to a deleted file, without their size. The processes
        # that cannot be read are left out, rather than one error each.
        commandLine: "if ! command -v lsof >/dev/null 2>&1; then %{SUDO:find} find /proc/[0-9]*/fd -lname '*(deleted)' -printf '%p -> %l\\n' 2>/dev/null; fi"
      files:
        type: tableUnion
        tables:
        - ${source::lsof}
        - ${source::proc}
    result:
      source: ${source::files}

  kernelLog:
    description: Returns the warnings and errors of the kernel since the boot, as far as its ring buffer or the journal keeps them, such as out-of-memory kills, disk and file system I/O errors, hung tasks, hardware errors and network link changes. Use it when a process died unexpectedly or a device misbehaves.
    sources:
      kernel:
        type: commandLine
        # The kernel ring buffer first: the journal may have rotated them away, or never read them.
        # Where dmesg is restricted to root, the journal, which the adm or systemd-journal group may read.
        commandLine: "%{SUDO:dmesg} dmesg -T -l emerg,alert,crit,err,warn 2>/dev/null || journalctl -k -p warning --no-pager 2>&1"
    result:
      source: ${source::kernel}

  systemLog:
    description: Returns the last entries of the system journal at or above a priority, all services included, over the last minutes. Use it to find what failed around an incident. Linux_serviceLogs reads the journal of one service.
    parameters:
      priority:
        description: The lowest priority to return
        default: err
        enum: [ emerg, alert, crit, err, warning, notice, info, debug ]
      minutes:
        type: integer
        description: How far back to read, in minutes, 1 to 10080 (a week)
        default: 60
        pattern: '[1-9][0-9]{0,3}|100[0-7][0-9]|10080'
      lines:
        type: integer
        description: How many of the last entries to return, 1 to 100000
        default: 1000
        pattern: '[1-9][0-9]{0,4}|100000'
    # Without journal files (no journald, or Storage=none, where journalctl finds nothing and still succeeds), the end
    # of the syslog file, whatever the priority and the time. Two sources, as a command line elevates a single command
    sources:
      journal:
        type: commandLine
        commandLine: "if ls /var/log/journal/*/*.journal >/dev/null 2>&1 || ls /run/log/journal/*/*.journal >/dev/null 2>&1; then %{SUDO:journalctl} journalctl -p ${param::priority} --since=-${param::minutes}min -n ${param::lines} --no-pager 2>&1; fi"
      syslog:
        type: commandLine
        commandLine: "if ls /var/log/journal/*/*.journal >/dev/null 2>&1 || ls /run/log/journal/*/*.journal >/dev/null 2>&1; then :; else %{SUDO:tail} tail -n ${param::lines} /var/log/messages 2>&1 || %{SUDO:tail} tail -n ${param::lines} /var/log/syslog 2>&1; fi"
      log:
        type: tableUnion
        tables:
        - ${source::journal}
        - ${source::syslog}
    result:
      source: ${source::log}

  performanceSnapshot:
    description: Samples the activity of the host for a few seconds, with the load averages, the pressure stall information (the share of time tasks waited for CPU, memory or I/O), vmstat (run queue, swapping, I/O wait) and, when sysstat is installed, iostat (utilization and latency of each disk). Use it when the host is slow, to tell a CPU, memory or disk bottleneck apart.
    sources:
      snapshot:
        type: commandLine
        commandLine: |
          uptime
          grep -H . /proc/pressure/* 2>/dev/null
          vmstat 1 5 2>&1
          iostat -dxyk 1 2 2>/dev/null || echo "iostat is not installed (sysstat)"
    result:
      source: ${source::snapshot}

  networkSockets:
    description: Lists the listening TCP and UDP sockets with their process, a summary of the sockets, and how many TCP connections are in each state. Use it when a service does not answer on its port, or when connections pile up. Many CLOSE-WAIT connections mean an application does not close them, many TIME-WAIT a high connection rate.
    sources:
      sockets:
        type: commandLine
        commandLine: |
          %{SUDO:ss} ss -tulpn 2>&1
          ss -s 2>&1
      states:
        type: commandLine
        commandLine: ss -tan 2>/dev/null
        computes:
        # The TCP connections counted in each state
        - type: awk
          script: |
            NR > 1 { count[$1]++ }
            END { for (state in count) print state " " count[state] }
      all:
        type: tableUnion
        tables:
        - ${source::sockets}
        - ${source::states}
    result:
      source: ${source::all}

  timeSync:
    description: Shows the time and the time zone of the host, whether its clock is synchronized, and its offset to the time sources of chrony, ntpd or systemd-timesyncd. Use it when TLS, Kerberos or cluster errors point to a clock drift.
    sources:
      time:
        type: commandLine
        commandLine: |
          date
          timedatectl 2>&1
          chronyc tracking 2>/dev/null || ntpq -pn 2>/dev/null || timedatectl timesync-status 2>/dev/null || echo "Neither chronyc, ntpq nor systemd-timesyncd answered"
    result:
      source: ${source::time}

  rebootHistory:
    description: Shows when the host started, its last reboots and shutdowns, and whether installed updates wait for a reboot. Use it when a host restarted unexpectedly, or before planning a reboot.
    sources:
      history:
        type: commandLine
        commandLine: |
          echo "Up since $(uptime -s 2>/dev/null)"
          last -x -F reboot shutdown 2>&1
          [ -f /var/run/reboot-required ] && echo "Reboot required by $(cat /var/run/reboot-required.pkgs 2>/dev/null | tr '\n' ' ')"
          needs-restarting -r 2>/dev/null
          true
    result:
      source: ${source::history}

  vacuumJournal:
    description: Deletes the oldest archived files of the systemd journal until the journal takes no more than the given size, to free space. The active journal files are kept. Use it when /var or / is full and Linux_largestFiles points to /var/log/journal.
    destructive: true
    parameters:
      megabytes:
        type: integer
        description: The size to shrink the journal to, in megabytes, 50 to 100000
        required: true
        pattern: '[5-9][0-9]|[1-9][0-9]{2,4}|100000'
    sources:
      vacuum:
        type: commandLine
        commandLine: "%{SUDO:journalctl} journalctl --vacuum-size=${param::megabytes}M 2>&1"
    result:
      source: ${source::vacuum}

  reboot:
    description: Schedules a reboot of the host in a few minutes, which warns the logged-in users and lets the tool return. Linux_cancelReboot cancels it. Use it only when the user explicitly asks for a reboot.
    destructive: true
    parameters:
      minutes:
        type: integer
        description: Minutes before the reboot, 1 to 60
        default: 1
        pattern: '[1-9]|[1-5][0-9]|60'
    sources:
      shutdown:
        type: commandLine
        commandLine: "%{SUDO:shutdown} shutdown -r +${param::minutes} 'Reboot requested through MetricsHub' 2>&1"
    result:
      source: ${source::shutdown}

  cancelReboot:
    description: Cancels a scheduled reboot or shutdown, such as the one Linux_reboot schedules.
    destructive: true
    sources:
      cancel:
        type: commandLine
        commandLine: "%{SUDO:shutdown} shutdown -c 2>&1 && echo No shutdown is scheduled any more"
    result:
      source: ${source::cancel}

  # Processes
  processDetails:
    description: Shows one process in detail, with its ps line, its /proc status (state, threads, memory, context switches), its limits and how many files it holds open. Use it on a PID from Linux_processes, e.g. to check whether a process nears its open files limit.
    parameters:
      pid:
        type: integer
        description: The process ID
        required: true
        pattern: '[1-9][0-9]{0,9}'
    sources:
      process:
        type: commandLine
        commandLine: |
          ps -o pid,ppid,user:32,pcpu,pmem,rss,vsz,nlwp,lstart,etime,stat,args -p ${param::pid} 2>&1
          cat /proc/${param::pid}/status 2>&1
          cat /proc/${param::pid}/limits 2>&1
          if ls /proc/${param::pid}/fd >/dev/null 2>&1; then echo "Open files: $(ls /proc/${param::pid}/fd | wc -l)"; else echo "Open files: unknown, /proc/${param::pid}/fd is not readable"; fi
    result:
      source: ${source::process}

  processOpenFiles:
    description: Lists the files, sockets and pipes a process holds open, its network connections included. Use it to see what a process writes to or is connected to, or which deleted file it holds.
    parameters:
      pid:
        type: integer
        description: The process ID
        required: true
        pattern: '[1-9][0-9]{0,9}'
    # Two sources, as a command line elevates a single command
    sources:
      lsof:
        type: commandLine
        commandLine: "if command -v lsof >/dev/null 2>&1; then %{SUDO:lsof} lsof -nP -p ${param::pid} 2>&1; [ -d /proc/${param::pid} ] || echo No process ${param::pid}; fi"
      proc:
        type: commandLine
        # Without lsof, the file descriptors of /proc, which only the owner of the process and root can list
        commandLine: "if ! command -v lsof >/dev/null 2>&1; then %{SUDO:ls} ls -l /proc/${param::pid}/fd 2>&1; fi"
      files:
        type: tableUnion
        tables:
        - ${source::lsof}
        - ${source::proc}
    result:
      source: ${source::files}

  killProcess:
    description: Sends a signal to a process. TERM asks it to stop cleanly, KILL stops it at once (its unsaved data is lost), HUP makes many daemons reload their configuration, INT interrupts it. Check the process with Linux_processDetails first. Use it only when the user asks to stop or reload a process.
    destructive: true
    parameters:
      pid:
        type: integer
        description: The process ID, 2 or more
        required: true
        # Not 1 (init), and no negative value, which would signal a whole process group
        pattern: '[2-9]|[1-9][0-9]{1,9}'
      signal:
        description: The signal to send
        default: TERM
        enum: [ TERM, KILL, HUP, INT ]
    sources:
      kill:
        type: commandLine
        commandLine: "%{SUDO:kill} kill -s ${param::signal} ${param::pid} 2>&1 && echo Signal ${param::signal} sent to process ${param::pid}"
    result:
      source: ${source::kill}

  # systemd services
  failedUnits:
    description: Lists the systemd units in the failed state, such as services, mounts, timers and sockets. Use it first when something does not work on a host, then Linux_serviceStatus on a failed service.
    sources:
      failed:
        type: commandLine
        commandLine: systemctl --failed --no-pager 2>&1
    result:
      source: ${source::failed}

  serviceStatus:
    description: Shows a systemd service in detail, with its state, main process, memory, restart count and last log lines, then its unit file and the drop-ins that override it. Use it on a failed, stopped or restarting service.
    parameters:
      service:
        # The default pattern takes unit names: sshd, sshd.service, getty@tty1.service
        description: The systemd unit, e.g. sshd.service
        required: true
    sources:
      status:
        type: commandLine
        commandLine: |
          systemctl status -l -n 20 --no-pager -- ${param::service} 2>&1
          systemctl show -p Restart,NRestarts,Result,ExecMainStatus,ActiveEnterTimestamp -- ${param::service} 2>&1
          systemctl cat --no-pager -- ${param::service} 2>&1
    result:
      source: ${source::status}

  serviceLogs:
    description: Returns the last lines of the journal of a systemd service. Use it when a service fails or restarts.
    parameters:
      service:
        description: The systemd unit, e.g. sshd.service
        required: true
      lines:
        type: integer
        description: How many lines to return, 1 to 100000
        default: 1000
        pattern: '[1-9][0-9]{0,4}|100000'
      priority:
        description: The lowest priority to return
        default: info
        enum: [ emerg, alert, crit, err, warning, notice, info, debug ]
    sources:
      journal:
        type: commandLine
        # The journal files the entries under the unit's name, not under its aliases (sshd.service is ssh.service on Debian)
        commandLine: |
          unit=$(systemctl show -p Id --value -- ${param::service} 2>/dev/null)
          [ -n "$unit" ] || unit=${param::service}
          %{SUDO:journalctl} journalctl --no-pager -n ${param::lines} -p ${param::priority} -u "$unit" 2>&1
    result:
      source: ${source::journal}

  controlService:
    description: Starts, stops, restarts or reloads a systemd service, or clears its failed state (reset-failed), then shows its status. Use it only when the user asks, e.g. to restart a service once the cause of its failure is fixed.
    destructive: true
    parameters:
      service:
        description: The systemd unit, e.g. nginx.service
        required: true
      action:
        description: What to do with the service
        required: true
        enum: [ start, stop, restart, reload, reset-failed ]
    sources:
      control:
        type: commandLine
        commandLine: |
          %{SUDO:systemctl} systemctl ${param::action} -- ${param::service} 2>&1
          systemctl status -l -n 10 --no-pager -- ${param::service} 2>&1
    result:
      source: ${source::control}

  # Logs
  readLog:
    description: Reads the last lines of a log file and returns them, or only those matching a regular expression. Use it to read the log of an application, e.g. /var/log/nginx/error.log or /opt/app/logs/server.log. Only the files under /var/log are read with sudo, when it is enabled for tail.
    parameters:
      path:
        description: Absolute path of a file under /var/log, or of a file whose name ends with .log
        required: true
        # Under /var/log, or a .log file, each name starting with a letter, a digit or _: no "..", no hidden file
        pattern: '/var/log(/[A-Za-z0-9_][A-Za-z0-9_.@-]*)+|(/[A-Za-z0-9_][A-Za-z0-9_.@-]*)+\.log'
      match:
        description: Basic regular expression, as with grep without -E, that the returned lines must contain, e.g. ERROR\|WARN (empty for all lines)
        default: ''
        # Never sent to the host: MetricsHub keeps the matching lines
        pattern: '.*'
      lines:
        type: integer
        description: How many of the last lines of the file to read, 1 to 100000
        default: 1000
        pattern: '[1-9][0-9]{0,4}|100000'
    sources:
      log:
        type: commandLine
        # The path checked again once resolved: a symbolic link must not lead elsewhere. Only /var/log is read with sudo:
        # elsewhere, a user who can write in the directory could swap the file for a link between the check and the read
        commandLine: |
          file=$(readlink -f -- '${esc(bash)::param::path}')
          case "$file" in
          "") echo "Refused: the path cannot be resolved, a directory on the way is missing or cannot be read" ;;
          */.*) echo "Refused: the path leads to $file, a hidden file or directory" ;;
          /var/log/*) %{SUDO:tail} tail -n ${param::lines} -- "$file" 2>&1 ;;
          *.log) tail -n ${param::lines} -- "$file" 2>&1 ;;
          *) echo "Refused: the path leads to $file, neither under /var/log nor a .log file" ;;
          esac
        # The matching lines, and the refusals and errors of tail whatever the expression (an empty one matches all)
        keep: '${param::match}\|^Refused: \|^tail: '
    result:
      source: ${source::log}
