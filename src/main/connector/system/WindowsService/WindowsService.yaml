extends:
- ../../semconv/System
connector:
  displayName: Windows - Services (WMI)
  platforms: Microsoft Windows
  reliesOn: WMI
  information: Gives OS specific service information and metrics
  detection:
    connectionTypes:
    - remote
    - local
    appliesTo:
    - nt
    disableAutoDetection: true
    criteria:
    # START SNIPPET: wmiCriterion
    - type: wmi
      namespace: root\CIMv2
      query: SELECT * FROM Win32_OperatingSystem
    # END SNIPPET: wmiCriterion
    tags: [ system, windows ]
  variables:
    serviceNames:
      description: Regular expression pattern to identify the services to monitor.
      defaultValue: .*
monitors:
  service:
    simple:
      sources:
        # Name;State;StartMode;DisplayName;StartName;PathName;ProcessId
        serviceInformation:
          type: wmi
          namespace: root\CIMv2
          query: |
            SELECT
              Name,
              State,
              StartMode,
              DisplayName,
              StartName,
              PathName,
              ProcessId
            FROM
              Win32_Service
          computes:
          - type: keepOnlyMatchingLines
            column: 1
            regExp: ${var::serviceNames} # In metricshub.yaml, the regex should be set this way "serviceNames: UserDataSvc\|ConsentUxUserSvc"
          - type: translate
            column: 2
            translationTable: ${translation::serviceStateTranslationTable}
      mapping:
        source: ${source::serviceInformation}
        attributes:
          id: $1
          system.service.start: $3
          system.service.name: $4
          system.service.username: $5
          system.service.command: $6
        metrics:
          system.service.status: $2
translations:
  serviceStateTranslationTable:
    Running: running
    Stopped: stopped
    Paused: paused
    Start Pending: start_pending
    Stop Pending: stop_pending
    Pause Pending: pause_pending
    Continue Pending: continue_pending
    Unknown: unknown
    Default: unknown
