---
extends:
- ../../semconv/Hardware
connector:
  displayName: Nvidia-Smi
  platforms: 
  - Nvidia
  - Microsoft Windows
  - Linux
  reliesOn: NVIDIA drivers with NVIDIA-SMI support.
  information: This connector provides hardware information about most Nvidia GPUs. (Clocking).
  detection:
    connectionTypes:
    - remote
    - local
    appliesTo:
    - NT
    - Linux
    criteria:
    - type: commandLine
      commandLine: nvidia-smi
      expectedResult: \(Driver\|KMD\) Version
      errorMessage: nvidia-smi not found at target host.
    tags: [ hardware , nvidia, windows, linux ]
monitors:
  enclosure:
    discovery:
      sources:
        source(1):
          type: commandLine
          commandLine: nvidia-smi -q
          timeout: 90
          computes:
          - type: awk
            script: ${file::nvidiaSmi.awk}
            output: table
      mapping:
        source: ${source::monitors.enclosure.discovery.sources.source(1)}
  gpu:
    keys:
    - id
    discovery:
      sources:
        source(1):
          type: copy
          from: ${source::monitors.enclosure.discovery.sources.source(1)}
          computes:
          - type: keepOnlyMatchingLines
            column: 1
            regExp: ^GPU$
      mapping:
        source: ${source::monitors.gpu.discovery.sources.source(1)}
        attributes:
          vendor: NVIDIA
          id: $2
          __display_id: $2
          model: $14
          serial_number: $15
          driver_version: $17
          firmware_version: $19
          info: ${awk::join(" ", $16, $18)}
          hw.parent.type: enclosure
          name: ${awk::sprintf("%s (%s - %s - %s)", $2, "NVIDIA", $14, mebiBytes2HumanFormat($20))}
        metrics:
          hw.gpu.memory.limit: mebiByte2Byte($20)
          # Only alert when the memory is completely full: inference engines (e.g. vLLM) pre-allocate most of the GPU memory
          hw.gpu.memory.utilization.limit{limit_type="degraded"}: 1
          hw.gpu.memory.utilization.limit{limit_type="critical"}: 1
    collect:
      type: multiInstance
      sources:
        source(1):
          type: commandLine
          commandLine: nvidia-smi -q
          timeout: 90
          computes:
          - type: awk
            script: ${file::nvidiaSmi.awk}
            output: table
          - type: keepOnlyMatchingLines
            column: 1
            regExp: ^GPU$
      mapping:
        source: ${source::monitors.gpu.collect.sources.source(1)}
        attributes:
          id: $2
        metrics:
          hw.gpu.utilization{task="general"}: percent2Ratio($5)
          hw.gpu.memory.utilization: percent2Ratio($6)
          hw.gpu.memory.usage{hw.memory.state="used"}: mebiByte2Byte($21)
          hw.gpu.memory.usage{hw.memory.state="reserved"}: mebiByte2Byte($22)
          hw.gpu.memory.usage{hw.memory.state="free"}: mebiByte2Byte($23)
          hw.gpu.utilization{task="encoder"}: percent2Ratio($7)
          hw.gpu.utilization{task="decoder"}: percent2Ratio($8)
          hw.gpu.io{direction="transmit"}: fakeCounter($3)
          hw.gpu.io{direction="receive"}: fakeCounter($4)
          hw.power{hw.type="gpu"}: $9
          hw.energy{hw.type="gpu"}: fakeCounter($9)
  temperature:
    keys:
    - id
    discovery:
      sources:
        source(1):
          type: copy
          from: ${source::monitors.enclosure.discovery.sources.source(1)}
          computes:
          - type: keepOnlyMatchingLines
            column: 1
            regExp: ^TEMPERATURE$
      mapping:
        source: ${source::monitors.temperature.discovery.sources.source(1)}
        attributes:
          id: $2
          __display_id: $2
          sensor_location: gpu
          hw.parent.type: enclosure
          name: ${awk::sprintf("%s (%s)", $2, "gpu")}
        metrics:
          hw.temperature.limit{limit_type="high.degraded"}: $4
          hw.temperature.limit{limit_type="high.critical"}: $5
    collect:
      type: multiInstance
      sources:
        source(1):
          type: commandLine
          commandLine: nvidia-smi -q
          timeout: 90
          computes:
          - type: awk
            script: ${file::nvidiaSmi.awk}
            output: table
          - type: keepOnlyMatchingLines
            column: 1
            regExp: ^TEMPERATURE$
      mapping:
        source: ${source::monitors.temperature.collect.sources.source(1)}
        attributes:
          id: $2
        metrics:
          hw.temperature: $3
  voltage:
    keys:
    - id
    discovery:
      sources:
        source(1):
          type: copy
          from: ${source::monitors.enclosure.discovery.sources.source(1)}
          computes:
          - type: keepOnlyMatchingLines
            column: 1
            regExp: ^VOLTAGE$
          - type: keepOnlyMatchingLines
            column: 3
            regExp: .
      mapping:
        source: ${source::monitors.voltage.discovery.sources.source(1)}
        attributes:
          id: $2
          __display_id: $2
          sensor_location: gpu
          hw.parent.type: enclosure
          name: ${awk::sprintf("%s (%s)", $2, "gpu")}
    collect:
      type: multiInstance
      sources:
        source(1):
          type: commandLine
          commandLine: nvidia-smi -q
          timeout: 90
          computes:
          - type: awk
            script: ${file::nvidiaSmi.awk}
            output: table
          - type: keepOnlyMatchingLines
            column: 1
            regExp: ^VOLTAGE$
      mapping:
        source: ${source::monitors.voltage.collect.sources.source(1)}
        attributes:
          id: $2
        metrics:
          hw.voltage: milliVolt2Volt($3)
  fan:
    keys:
    - id
    discovery:
      sources:
        source(1):
          type: copy
          from: ${source::monitors.enclosure.discovery.sources.source(1)}
          computes:
          - type: keepOnlyMatchingLines
            column: 1
            regExp: ^FAN$
          - type: keepOnlyMatchingLines
            column: 3
            regExp: .
      mapping:
        source: ${source::monitors.fan.discovery.sources.source(1)}
        attributes:
          id: $2
          __display_id: $2
          sensor_location: gpu
          hw.parent.type: enclosure
          name: ${awk::sprintf("%s (%s)", $2, "gpu")}
        metrics:
          hw.fan.speed_ratio.limit{limit_type="low.degraded"}: percent2Ratio("10")
          hw.fan.speed_ratio.limit{limit_type="low.critical"}: percent2Ratio("0")
    collect:
      type: multiInstance
      sources:
        source(1):
          type: commandLine
          commandLine: nvidia-smi -q
          timeout: 90
          computes:
          - type: awk
            script: ${file::nvidiaSmi.awk}
            output: table
          - type: keepOnlyMatchingLines
            column: 1
            regExp: ^FAN$
      mapping:
        source: ${source::monitors.fan.collect.sources.source(1)}
        attributes:
          id: $2
        metrics:
          hw.fan.speed_ratio: percent2Ratio($3)

# Tools an AI assistant runs through the MetricsHub MCP server
tools:

  gpuProcesses:
    description: Lists the processes using each GPU, with the GPU memory they use, first all of them, graphics ones (type G, e.g. Xorg) included, then the compute ones with their full name. Use it when a GPU is full or busy, to find which process holds it.
    sources:
      processes:
        type: commandLine
        # The summary lists the graphics processes too, at its end, but cuts their names. One line with && for both
        # shells, cmd.exe on Windows and sh on Linux: the summary first, as the compute query fails where it is not
        # supported (WSL). Over WinRM, a command that exits with an error code loses its whole output: the echo after
        # || ends the line with success, in both shells.
        commandLine: nvidia-smi 2>&1 && nvidia-smi --query-compute-apps=gpu_bus_id,pid,process_name,used_memory --format=csv 2>&1 || echo nvidia-smi failed
    result:
      source: ${source::processes}

  gpuPerformance:
    description: Shows why each GPU runs slower than it could (the throttle reasons, such as the power cap, a thermal or a hardware slowdown), with its clocks, power draw, temperatures and ECC error counts. Use it when GPU workloads are slow, or a GPU reports errors.
    sources:
      performance:
        type: commandLine
        # The echo after || keeps the output over WinRM (see gpuProcesses)
        commandLine: nvidia-smi -q -d PERFORMANCE,CLOCK,POWER,TEMPERATURE,ECC 2>&1 || echo nvidia-smi failed
        timeout: 90
    result:
      source: ${source::performance}
