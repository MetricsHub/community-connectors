---
extends:
- ../../semconv/Hardware
connector:
  displayName: libvirt (virsh)
  platforms: 
  - Linux
  - Microsoft Windows
  - QEMU/KVM
  - VirtualBox
  - VMware
  - Xen
  reliesOn: libvirt API
  version: 1.0
  information: This connector enables hardware monitoring for VMs through the virsh command. The libvirt API must be installed on the host.
  detection:
    connectionTypes:
    - remote
    - local
    appliesTo:
    - Linux
    criteria:
    - type: productRequirements
      kmVersion: 11.3.00
    - type: commandLine
      commandLine: virsh list
      expectedResult: Name
    tags: [ hardware, linux ]
monitors:
  vm:
    keys:
    - id
    discovery:
      sources:
        source(1):
          type: commandLine
          commandLine: virsh list --all --name | while read -r name; do [ -z "$name" ] || { echo "Domain $name"; virsh dominfo "$name"; }; done
          computes:
          - type: awk
            script: ${file::vm.awk}
      mapping:
        source: ${source::monitors.vm.discovery.sources.source(1)}
        attributes:
          id: $1
          __display_id: $1
          vm.host.name: $1
          info: $4
          hw.parent.type: enclosure
          name: ${awk::sprintf("%s (%s)", $1, $1)}
        conditionalCollection:
          hw.power{hw.type="vm"}: 0
    collect:
      type: multiInstance
      sources:
        source(1):
          type: commandLine
          commandLine: virsh list --all --name | while read -r name; do [ -z "$name" ] || { echo "Domain $name"; virsh dominfo "$name"; }; done
          computes:
          - type: awk
            script: ${file::vm.awk}
          # No state: virsh dominfo failed for this domain, collect nothing rather than report it off
          - type: keepOnlyMatchingLines
            column: 2
            regExp: .
          - type: translate
            column: 2
            translationTable: ${translation::stateTranslationTable}
      mapping:
        source: ${source::monitors.vm.collect.sources.source(1)}
        attributes:
          id: $1
        metrics:
          hw.power_state{hw.type="vm"}: $2
          hw.vm.power_ratio: computePowerShareRatio($3)
translations:
  stateTranslationTable:
    running: "on"
    paused: suspended
    default: "off"
    suspended: suspended

# Tools an AI assistant runs through the MetricsHub MCP server
tools:

  vmDetails:
    description: Shows a virtual machine in detail, with its state and the reason for it (e.g. paused by a storage I/O error), its CPUs, memory and autostart setting, its disk errors, and its statistics (CPU time, balloon memory, block and network I/O). Use it when a VM is down, paused or slow.
    parameters:
      name:
        description: The VM name or UUID, as virsh list --all --name or --uuid shows it. Not a numeric name, which virsh takes for the ID of a running VM
        required: true
        # Not all digits: virsh looks a domain up by ID first
        pattern: '[A-Za-z_][A-Za-z0-9_.@-]*|[0-9]+[A-Za-z_.@-][A-Za-z0-9_.@-]*'
    sources:
      details:
        type: commandLine
        commandLine: |
          virsh domstate --domain ${param::name} --reason 2>&1
          virsh dominfo --domain ${param::name} 2>&1
          virsh domblkerror --domain ${param::name} 2>&1
          virsh domstats ${param::name} 2>&1
    result:
      source: ${source::details}

  controlVm:
    description: Starts, shuts down (cleanly, through ACPI or the guest agent), reboots, suspends or resumes a virtual machine, or destroys it (powers it off at once, like pulling the plug). A VM paused by storage errors resumes once its storage has space again. Use it only when the user asks.
    destructive: true
    parameters:
      name:
        description: The VM name or UUID, as virsh list --all --name or --uuid shows it. Not a numeric name, which virsh takes for the ID of a running VM
        required: true
        # Not all digits: virsh looks a domain up by ID first
        pattern: '[A-Za-z_][A-Za-z0-9_.@-]*|[0-9]+[A-Za-z_.@-][A-Za-z0-9_.@-]*'
      action:
        description: What to do with the VM
        required: true
        enum: [ start, shutdown, reboot, suspend, resume, destroy ]
    sources:
      control:
        type: commandLine
        commandLine: |
          virsh ${param::action} --domain ${param::name} 2>&1
          virsh domstate --domain ${param::name} --reason 2>&1
    result:
      source: ${source::control}
