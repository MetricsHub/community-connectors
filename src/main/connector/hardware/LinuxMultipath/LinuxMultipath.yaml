---
extends:
- ../../semconv/Hardware
connector:
  displayName: Linux - Multipath
  platforms: Linux
  reliesOn: Linux multipath utility
  version: 1.0
  information: This connector enables the monitoring of HBA cards on all Linux systems through the multipath utility.
  detection:
    connectionTypes:
    - remote
    - local
    appliesTo:
    - Linux
    criteria:
    # OS should be Linux
    - type: deviceType
      keep:
      - Linux
    # Test the multipath command
    - type: commandLine
      commandLine: "%{SUDO:multipath} multipath -l"
      expectedResult: \(^\\_\)\|\(^\`\-\+\-\)
    tags: [ hardware, linux ]
sudoCommands:
- multipath
monitors:
  lun:
    keys:
    - id
    discovery:
      sources:
        source(1):
          # Get the list of Ports from multipath -l
          type: commandLine
          commandLine: "%{SUDO:multipath} multipath -l"
          computes:
            # AWK it
            # LunName;LunInfo;LunStatus;
          - type: awk
            script: ${file::lun.awk}
            keep: ^MSHW;
            separators: ;
            selectColumns: "2,3,5"
          - type: toTable
      mapping:
        # InstanceTable = Source(1)
        # LunName;LunInfo;LunStatus;
        source: ${source::monitors.lun.discovery.sources.source(1)}
        attributes:
          id: $1
          array_name: $2
          hw.parent.type: enclosure
          name: $2
    collect:
      # Collect type is multi-instance
      type: multiInstance
      sources:
        source(1):
          # Get the list of Ports from multipath -l
          type: commandLine
          commandLine: "%{SUDO:multipath} multipath -l"
          computes:
            # AWK it
            # LunName;NumberPaths;LunStatus;LunStatusInfo;AvailablePathInformation;
          - type: awk
            script: ${file::lun.awk}
            keep: ^MSHW;
            separators: ;
            selectColumns: 2,4,5,6,7
          - type: toTable
      mapping:
        # ValueTable = Source(1)
        # LunName;NumberPaths;LunStatus;LunStatusInfo;AvailablePathInformation;
        source: ${source::monitors.lun.collect.sources.source(1)}
        attributes:
          id: $1
        metrics:
          hw.lun.paths: $2
        legacyTextParameters:
          AvailablePathInformation: $5

# Tools an AI assistant runs through the MetricsHub MCP server
tools:

  multipathTopology:
    description: Shows each multipath device with its path groups and paths, their priorities and their states, as multipath -ll prints them. Use it when a LUN loses paths, to see which path and which HBA port failed.
    parameters:
      device:
        description: A multipath device, by name or WWID, e.g. mpatha (empty for all of them)
        default: ''
    sources:
      topology:
        type: commandLine
        commandLine: "%{SUDO:multipath} multipath -ll ${param::device} 2>&1"
    result:
      source: ${source::topology}
