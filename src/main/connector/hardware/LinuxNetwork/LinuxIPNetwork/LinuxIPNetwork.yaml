---
extends:
- ../../../semconv/Hardware
- ../LinuxNetwork-header/LinuxNetwork-header
constants:
  GLOBAL_COMMAND_LINE: /sbin/ip a
  COLLECT_COMMAND_LINE: /sbin/ip -s link show dev ${attribute::id}
connector:
  displayName: Linux - Network (ip)
  platforms: Linux
  reliesOn: Linux system commands (ip)
  version: 1.0
  information: This connector enables the monitoring of active network cards on all Linux systems using ip command.
  detection:
    connectionTypes:
    - remote
    - local
    appliesTo:
    - Linux
    supersedes:
    - LinuxIfConfigNetwork
    tags: [ hardware, linux ]

# Tools an AI assistant runs through the MetricsHub MCP server
tools:

  interfaceDetails:
    description: Shows a network interface in detail, with its state, addresses, packet and error counters and, through ethtool, its speed, duplex, link detection and the driver counters that are not zero. Use it when a link is down, slow or drops packets.
    parameters:
      interface:
        description: The interface name, e.g. eth0 or ens192
        required: true
    sources:
      details:
        type: commandLine
        commandLine: |
          /sbin/ip -s -s link show dev ${param::interface} 2>&1
          /sbin/ip addr show dev ${param::interface} 2>&1
          %{SUDO:ethtool} /usr/sbin/ethtool ${param::interface} 2>&1
          %{SUDO:ethtool} /usr/sbin/ethtool -S ${param::interface} 2>&1 | grep -v ': 0$'
    result:
      source: ${source::details}

  routes:
    description: Shows the IPv4 and IPv6 routing tables, the routing policy rules and the neighbor (ARP and NDP) table. Use it when the host cannot reach a network, or reaches it through the wrong gateway or interface.
    sources:
      routes:
        type: commandLine
        commandLine: |
          /sbin/ip route 2>&1
          /sbin/ip -6 route 2>&1
          /sbin/ip rule 2>&1
          /sbin/ip neigh 2>&1 | head -n 200
    result:
      source: ${source::routes}

  ping:
    description: Pings a host or an address 4 times from the monitored host, and returns the packet loss and the round-trip times. Use it to check whether the monitored host reaches its gateway, a DNS server or a peer.
    parameters:
      target:
        description: Host name or IP address, e.g. 10.0.0.1 or db-01.example.com
        required: true
    sources:
      ping:
        type: commandLine
        commandLine: ping -c 4 -W 2 -- ${param::target} 2>&1
    result:
      source: ${source::ping}
