# Design notes:
# - Reads Linux sysfs only (device tree, thermal and hwmon): no extra package
#   and no sudo rule are required.
# - The board model and serial number come from the device tree that the
#   Raspberry Pi firmware populates.
# - The CPU temperature comes from the thermal zone named cpu-thermal or
#   soc_thermal.
# - The fan speed is optional: it is reported only when the kernel exposes a
#   fan1_input tachometer, as the Raspberry Pi 5 cooling_fan device does.
# - The temperature and fan commands print semicolon-separated rows. The board
#   command prints raw device-tree values that a Jawk compute parses.

extends:
- ../../semconv/Hardware

connector:
  displayName: Raspberry Pi Hardware
  platforms: Raspberry Pi
  reliesOn: Linux device tree, thermal and hwmon sysfs interfaces
  information: >
    Monitors the Raspberry Pi board (model and serial number), its CPU
    temperature and, when the kernel exposes a tachometer, the cooling fan
    speed in RPM.
  version: 1.0

  detection:
    connectionTypes:
    - remote
    - local
    appliesTo:
    - Linux
    criteria:
    # The Raspberry Pi firmware stores the board model in the device tree as a
    # NUL-terminated string. tr strips the NUL byte before the match.
    - type: commandLine
      commandLine: >
        test -r /sys/firmware/devicetree/base/model &&
        tr -d '\000' < /sys/firmware/devicetree/base/model
      expectedResult: ^Raspberry Pi
      errorMessage: The target does not appear to be a Raspberry Pi.
    tags: [ hardware, linux, raspberry-pi ]

monitors:
  # The board is the parent of the temperature and fan monitors.
  enclosure:
    simple:
      sources:
        board:
          type: commandLine
          # Prints one "<device-tree path>:<value>" line per property. grep -a
          # reads the NUL-terminated values as text and ends each line with a
          # newline, then tr strips the NUL bytes. A missing property is
          # skipped silently. The firmware sets serial-number whatever the
          # kernel, unlike the Serial line of /proc/cpuinfo, which only
          # Raspberry Pi kernels print.
          commandLine: >-
            grep -a . /sys/firmware/devicetree/base/model
            /sys/firmware/devicetree/base/serial-number 2>/dev/null | tr -d '\000'
          computes:
          # Output columns:
          # id;model;serial_number
          #
          # The id is a constant, since a host has a single board. The
          # temperature and fan monitors use it as hw.parent.id. The trailing
          # separator keeps an empty serial_number column when the property is
          # missing. Nothing is printed without a model, so a failed command
          # does not blank the attributes of the existing enclosure.
          - type: awk
            script: |
              BEGIN { FS = ":" }
              $1 ~ /\/model$/ { model = $2 }
              $1 ~ /\/serial-number$/ { serial = $2 }
              END { if (model != "") print "raspberry-pi;" model ";" serial ";" }
      mapping:
        source: ${source::board}
        attributes:
          id: $1
          # The model already includes the vendor name, so the engine names
          # the enclosure "Computer: <model>" without repeating it.
          vendor: Raspberry Pi
          model: $2
          serial_number: $3
          type: Computer

  temperature:
    simple:
      sources:
        cpuTemperature:
          type: commandLine
          # Output columns:
          # id;thermal_zone_type;temperature_millicelsius
          #
          # Thermal-zone numbering is not stable across kernels, so the zone
          # is matched by its type rather than assumed to be thermal_zone0.
          commandLine: >-
            for zone in /sys/class/thermal/thermal_zone*; do
              test -r "$zone/type" && test -r "$zone/temp" || continue;
              type=$(cat "$zone/type");
              case "$type" in
                cpu-thermal|soc_thermal)
                  value=$(cat "$zone/temp");
                  printf 'cpu;%s;%s\n' "$type" "$value";
                  break
                  ;;
              esac;
            done
          computes:
          # sysfs reports millidegrees Celsius: convert to degrees Celsius.
          - type: divide
            column: 3
            value: 1000
      mapping:
        source: ${source::cpuTemperature}
        attributes:
          id: $1
          __display_id: CPU temperature
          # The engine counts a sensor whose name contains "CPU" in the host
          # CPU temperature average and heating margin.
          name: CPU temperature
          sensor_location: CPU
          hw.parent.type: enclosure
          hw.parent.id: raspberry-pi
        metrics:
          hw.temperature: $3
          # The firmware throttles the ARM cores from 80 °C, and both the ARM
          # cores and the GPU above 85 °C.
          hw.temperature.limit{limit_type="high.degraded"}: 80
          hw.temperature.limit{limit_type="high.critical"}: 85

  fan:
    simple:
      sources:
        coolingFan:
          type: commandLine
          # Output columns:
          # id;fan_name;speed_rpm
          #
          # fan1_input is the standard hwmon tachometer attribute. The
          # Raspberry Pi 5 cooling_fan device is tried first, then any hwmon
          # device. The globs tolerate the hwmon index changing between boots.
          # Non-numeric readings are skipped. Without a readable tachometer,
          # the command prints nothing and no fan monitor is created.
          commandLine: >-
            for input in /sys/devices/platform/cooling_fan/hwmon/*/fan1_input /sys/class/hwmon/hwmon*/fan1_input; do
              test -r "$input" || continue;
              value=$(cat "$input");
              case "$value" in
                ''|*[!0-9]*) continue ;;
              esac;
              printf 'cooling-fan;Cooling fan;%s\n' "$value";
              break;
            done
      mapping:
        source: ${source::coolingFan}
        attributes:
          id: $1
          __display_id: $2
          name: $2
          sensor_location: Board
          hw.parent.type: enclosure
          hw.parent.id: raspberry-pi
        metrics:
          hw.fan.speed: $3
