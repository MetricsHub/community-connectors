          computes:
            # Keep only disk lines
            # Disk or disk bay;DeviceID;Entity ID;Vendor;Model;SerialNumber;StatusArray;StatusInformation
          - type: keepOnlyMatchingLines
            column: 1
            valueList: Disk or disk bay,Disk or Disk Bay,Disk Drive Bay
            # Convert StatusArray to a simple (unique) PATROLStatus
            # Disk or disk bay;DeviceID;Entity ID;Vendor;Model;SerialNumber;Status;StatusInformation
          - type: convert
            column: 7
            conversion: array2SimpleStatus
      mapping:
        # ValueTable = Source(1)
        source: ${source::source(1)}
        attributes:
          id: $2
        metrics:
          hw.status{hw.type="physical_disk"}: $7
        legacyTextParameters:
          StatusInformation: $8
  led:
    simple:
      # Simple job (re-run every cycle) so that hw.led.state and hw.led.color follow the LED
      # Collect type is: multi-instance
      type: multiInstance
      keys:
      - id
      sources:
        source(1):
          # Source(1) = copy of Enclosure.Collect.Source(1)
          type: copy
          from: ${source::monitors.enclosure.collect.sources.source(1)}
          computes:
            # Keep only LED lines
            # LED;DeviceID;Name;EntityID;Color;OnStatus;OffStatus;BlinkingStatus;State;
          - type: keepOnlyMatchingLines
            column: 1
            valueList: led
      mapping:
        # InstanceTable = Source(1)
        source: ${source::source(1)}
        attributes:
          id: $2
          __display_id: $3
          hw.led.color: $5
          hw.led.state: ${awk::tolower($9)}
          __on_status: $6
          __off_status: $7
          __blinking_status: $8
          hw.parent.type: enclosure
          hw.parent.id: IPMI
          name: ${awk::sprintf("%s (%s)", $3, $5)}
        metrics:
          hw.status{hw.type="led"}: legacyLedStatus($9)
        legacyTextParameters:
          StatusInformation: $9
  other_device:
    keys:
    - id
    discovery:
      sources:
        source(1):
          # Source(1) = copy of Enclosure.Discovery.Source(1)
          type: copy
          from: ${source::monitors.enclosure.discovery.sources.source(1)}
          computes:
            # Exclude what we know already (case-insensitive), and label the SerialNumber
            # DeviceType;DeviceID;Entity ID;Vendor;Model;SerialNumber;StatusArray;StatusInformation;AdditionalInformation1;
          - type: awk
            output: table
            script: |
              BEGIN { n = split(tolower("Battery,Disk or Disk Bay,Disk or disk bay,Disk Drive Bay,Memory module,Memory Device,LED,Temperature,Voltage,Power supply,Fan,Fan Device,Enclosure,FRU,Processor,Current,PowerConsumption,EnergyUsage,Blade,Processing Blade"), types, ","); for (i = 1; i <= n; i++) known[types[i]] = 1 }
              !(tolower($1) in known) { $6 = "Serial Number: " $6; print }
      mapping:
        # InstanceTable = Source(1)
        source: ${source::source(1)}
        attributes:
          device_type: $1
          id: $2
          __display_id: $3
          additional_label: $4
          info: ${awk::join(" ", $9, $6)}
          hw.parent.type: enclosure
          hw.parent.id: IPMI
    collect:
      # Collect type is: multi-instance
      type: multiInstance
      sources:
        source(1):
          # Source(1) = copy of Enclosure.Collect.Source(1)
          type: copy
          from: ${source::monitors.enclosure.collect.sources.source(1)}
          computes:
            # Exclude what we know already
            # DeviceType;DeviceID;Entity ID;Vendor;Model;SerialNumber;StatusArray;StatusInformation
          - type: excludeMatchingLines
            column: 1
            valueList: Battery,Disk or Disk Bay,Disk or disk bay,Disk Drive Bay,Memory module,Memory Device,LED,Temperature,Voltage,Power supply,Fan,Fan Device,Enclosure,FRU,Processor,Current,PowerConsumption,EnergyUsage,Blade,Processing Blade
            # Convert StatusArray to a simple (unique) PATROLStatus
            # Disk or disk bay;DeviceID;Entity ID;Vendor;Model;SerialNumber;Status;StatusInformation
          - type: convert
            column: 7
            conversion: array2SimpleStatus
      mapping:
        # ValueTable = Source(1)
        source: ${source::source(1)}
        attributes:
          id: $2
        metrics:
          hw.status{hw.type="other_device"}: $7
        legacyTextParameters:
          StatusInformation: $8
