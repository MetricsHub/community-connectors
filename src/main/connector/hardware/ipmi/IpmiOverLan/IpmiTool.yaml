---
extends:
- ../../../semconv/Hardware
connector:
  displayName: IPMI Over-Lan
  platforms: IPMI
  reliesOn: IPMI
  information: This connector provides environmental information on several IPMI-enabled servers in-band and out-of-band (temperatures, fans, etc.).
  version: 2.0
  detection:
    connectionTypes:
    - remote
    - local
    appliesTo:
    - Linux
    - Solaris
    - NT
    - OOB
    supersedes:
    - lmsensors
    criteria:
    # Let the KM/PM validate whether IPMI is available or not
    # START SNIPPET: ipmiCriterion
    - type: ipmi
      forceSerialization: true
    # END SNIPPET: ipmiCriterion
    tags: [ hardware, linux, solaris, windows ]
monitors:
  enclosure:
    keys:
    - id
    discovery:
      sources:
        source(1):
          # Source(1) = IPMI source
          type: ipmi
          forceSerialization: true
          computes:
          # Process IPMI result througn an AWK script to interpret what can be interpreted
          - type: awk
            script: ${file::../interpret_sensors.awk}
            output: table
        source(2):
          # Source(2) = copy of Source(1)
          type: copy
          from: ${source::source(1)}
          computes:
            # Keep only the enclosure line
            # Enclosure;Vendor;Model;SerialNumber;Status;StatusInformation;PowerConsumption;AdditionalInformation
          - type: keepOnlyMatchingLines
            column: 1
            valueList: enclosure
      mapping:
        # InstanceTable = Source(2)
        source: ${source::source(2)}
        attributes:
          id: IPMI
          vendor: $2
          model: $3
          serial_number: $4
          info: $8
        conditionalCollection:
          hw.status{hw.type="enclosure"}: $5
          hw.enclosure.power: $7
    collect:
      # Collect type is "all instances in one shot
      type: multiInstance
      sources:
        source(1):
          # Source(1) = Get IPMI, will be re-used by all other collects
          type: ipmi
          forceSerialization: true
          computes:
          # Post-processing of the IPMI mess (which has already been greatly sorted out!)
          - type: awk
            script: ${file::../interpret_sensors.awk}
            output: table
        source(2):
          # Source(2) = copy of Source(1)
          type: copy
          from: ${source::source(1)}
          computes:
            # Keep only the enclosure line
            # Enclosure;Vendor;Model;SerialNumber;StatusArray;StatusInformation;PowerConsumption
          - type: keepOnlyMatchingLines
            column: 1
            valueList: enclosure
            # Convert StatusArray to a simple (unique) PATROLStatus
            # Enclosure;Vendor;Model;SerialNumber;Status;StatusInformation;PowerConsumption
          - type: convert
            column: 5
            conversion: array2SimpleStatus
      mapping:
        # ValueTable = Source(2)
        source: ${source::source(2)}
        attributes:
          id: IPMI
        metrics:
          hw.status{hw.type="enclosure"}: $5
          hw.enclosure.power: $7
          hw.enclosure.energy: fakeCounter($7)
        legacyTextParameters:
          StatusInformation: $6
  fan:
    keys:
    - id
    discovery:
      sources:
        source(1):
          # Source(1) = copy of Enclosure.Discovery.Source(1)
          # SensorType;SensorID;SensorName;Location;FanSpeed;WarningThreshold;AlarmThreshold
          type: copy
          from: ${source::monitors.enclosure.discovery.sources.source(1)}
          computes:
            # Keep only fans, with empty StatusArray, StatusInformation and AdditionalInformation1 columns
            # Fan;SensorID;SensorName;StatusArray;StatusInformation;Location;FanSpeed;WarningThreshold;AlarmThreshold;AdditionalInformation1
          - type: awk
            output: table
            script: |
              tolower($1) == "fan" { print $1, $2, $3, "", "", $4, $5, $6, $7, "" }
        source(2):
          # Source(2) = copy of Enclosure.Discovery.Source(1)
          type: copy
          from: ${source::monitors.enclosure.discovery.sources.source(1)}
          computes:
            # Keep only "Fan Device" lines
            # Fan Device;DeviceID;Entity ID;Vendor;Model;SerialNumber;StatusArray;StatusInformation;AdditionalInformation1;
            # with the interesting columns and empty Location, FanSpeed, WarningThreshold and AlarmThreshold columns
            # Fan Device;DeviceID;DisplayID;StatusArray;StatusInformation;Location;FanSpeed;WarningThreshold;AlarmThreshold;AdditionalInformation1
          - type: awk
            output: table
            script: |
              tolower($1) == "fan device" { print $1, $2, $3, $7, $8, "", "", "", "", $9 }
        source(3):
          # Source(3) = Table Union of Source(1) and Source(2)
          # Fan;DeviceID;SensorName;StatusArray;StatusInformation;Location;FanSpeed;WarningThreshold;AlarmThreshold;AdditionalInformation1;
          type: tableUnion
          tables:
          - ${source::source(1)}
          - ${source::source(2)}
      mapping:
        # The instance table
        source: ${source::source(3)}
        attributes:
          id: $2
          __display_id: $3
          sensor_location: $6
          info: $10
          hw.parent.type: enclosure
          hw.parent.id: IPMI
        metrics:
          hw.fan.speed.limit{limit_type="low.degraded"}: $8
          hw.fan.speed.limit{limit_type="low.critical"}: $9
        conditionalCollection:
          hw.status{hw.type="fan"}: $4
          hw.fan.speed: $7
    collect:
      # Collect type is "all instances in one shot
      type: multiInstance
      sources:
        source(1):
          # Source(1) = copy of Enclosure.Collect.Source(1)
          # SensorType;SensorID;SensorName;Location;Value;WarningThreshold;AlarmThreshold
          type: copy
          from: ${source::monitors.enclosure.collect.sources.source(1)}
          computes:
            # Keep only fans, with empty Status and StatusInformation columns
            # Fan;SensorID;SensorName;StatusArray;StatusInformation;Location;FanSpeed;WarningThreshold;AlarmThreshold
          - type: awk
            output: table
            script: |
              tolower($1) == "fan" { print $1, $2, $3, "", "", $4, $5, $6, $7 }
        source(2):
          # Source(2) = copy of Enclosure.Discovery.Source(1)
          type: copy
          from: ${source::monitors.enclosure.collect.sources.source(1)}
          computes:
            # Keep only "Fan Device" lines
            # Fan Device;DeviceID;Entity ID;Vendor;Model;SerialNumber;StatusArray;StatusInformation;AdditionalInformation1;
            # with the interesting columns, an empty SensorName and empty FanSpeed, WarningThreshold and AlarmThreshold columns
            # Fan Device;DeviceID;SensorName;StatusArray;StatusInformation;AdditionalInformation1;FanSpeed;WarningThreshold;AlarmThreshold
          - type: awk
            output: table
            script: |
              tolower($1) == "fan device" { print $1, $2, "", $7, $8, $9, "", "", "" }
            # Convert StatusArray to a simple (unique) PATROLStatus
            # Fan Device;DeviceID;SensorName;Status;StatusInformation;AdditionalInformation1;FanSpeed;WarningThreshold;AlarmThreshold
          - type: convert
            column: 4
            conversion: array2SimpleStatus
        source(3):
          # Source(3) = Table Union of Source(1) and Source(2)
          # Fan;DeviceID;SensorName;Status;StatusInformation;AdditionalInformation1;FanSpeed;WarningThreshold;AlarmThreshold
          type: tableUnion
          tables:
          - ${source::source(1)}
          - ${source::source(2)}
      mapping:
        # CollectTable = Source(3)
        # Fan;DeviceID;SensorName;Status;StatusInformation;AdditionalInformation1;FanSpeed;WarningThreshold;AlarmThreshold
        source: ${source::source(3)}
        attributes:
          id: $2
        metrics:
          hw.fan.speed: $7
          hw.status{hw.type="fan"}: $4
        legacyTextParameters:
          StatusInformation: $5
  temperature:
    keys:
    - id
    discovery:
      sources:
        source(1):
          # Source(1) = copy of Enclosure.Discovery.Source(1)
          # SensorType;SensorID;SensorName;Location;Value;WarningThreshold;AlarmThreshold
          type: copy
          from: ${source::monitors.enclosure.discovery.sources.source(1)}
          computes:
            # Keep only fans
          # START SNIPPET: keepOnlyMatchingLinesCompute
            # Temperature;SensorID;SensorName;Location;Value;WarningThreshold;AlarmThreshold
          - type: keepOnlyMatchingLines
            column: 1
            valueList: temperature
          # END SNIPPET: keepOnlyMatchingLinesCompute
      mapping:
        # The instance table
        source: ${source::source(1)}
        attributes:
          id: $2
          __display_id: $3
          sensor_location: $4
          hw.parent.type: enclosure
          hw.parent.id: IPMI
          name: ${awk::sprintf("%s (%s)", $3, $4)}
        metrics:
          hw.temperature.limit{limit_type="high.degraded"}: $6
          hw.temperature.limit{limit_type="high.critical"}: $7
    collect:
      # Collect type is "all instances in one shot
      type: multiInstance
      sources:
        source(1):
          # Source(1) = copy of Enclosure.Collect.Source(1)
          # SensorType;SensorID;SensorName;Location;Value;WarningThreshold;AlarmThreshold
          type: copy
          from: ${source::monitors.enclosure.collect.sources.source(1)}
          computes:
            # Keep only fans
            # Temperature;SensorID;SensorName;Location;Value;WarningThreshold;AlarmThreshold
          - type: keepOnlyMatchingLines
            column: 1
            valueList: temperature
      mapping:
        # CollectTable = Source(1)
        source: ${source::source(1)}
        attributes:
          id: $2
        metrics:
          hw.temperature: $5
  voltage:
    keys:
    - id
    discovery:
      sources:
        source(1):
          # Source(1) = copy of Enclosure.Discovery.Source(1)
          # SensorType;SensorID;SensorName;Location;Value;WarningThreshold;AlarmThreshold
          type: copy
          from: ${source::monitors.enclosure.discovery.sources.source(1)}
          computes:
            # Keep only fans
            # Voltage;SensorID;SensorName;Location;Value;WarningThreshold;AlarmThreshold
          - type: keepOnlyMatchingLines
            column: 1
            valueList: voltage
      mapping:
        # The instance table
        source: ${source::source(1)}
        attributes:
          id: $2
          __display_id: $3
          sensor_location: $4
          hw.parent.type: enclosure
          hw.parent.id: IPMI
          name: ${awk::sprintf("%s (%s)", $3, $4)}
        metrics:
          hw.voltage.limit{limit_type="low.critical"}: milliVolt2Volt($6)
          hw.voltage.limit{limit_type="high.critical"}: milliVolt2Volt($7)
    collect:
      # Collect type is all instances in one shot
      type: multiInstance
      sources:
        source(1):
          # Source(1) = copy of Enclosure.Collect.Source(1)
          # SensorType;SensorID;SensorName;Location;Value;WarningThreshold;AlarmThreshold
          type: copy
          from: ${source::monitors.enclosure.collect.sources.source(1)}
          computes:
            # Keep only fans
            # Voltage;SensorID;SensorName;Location;Value;WarningThreshold;AlarmThreshold
          - type: keepOnlyMatchingLines
            column: 1
            valueList: voltage
      mapping:
        # CollectTable = Source(1)
        source: ${source::source(1)}
        attributes:
          id: $2
        metrics:
          hw.voltage: milliVolt2Volt($5)
  power_supply:
    keys:
    - id
    discovery:
      sources:
        source(1):
          # Source(1) = copy of Enclosure.Discovery.Source(1)
          type: copy
          from: ${source::monitors.enclosure.discovery.sources.source(1)}
          computes:
            # Keep only power supply lines, with labelled Model and SerialNumber
            # Power supply;DeviceID;Entity ID;Vendor;Model;SerialNumber;StatusArray;StatusInformation;AdditionalInformation1;
          - type: awk
            output: table
            script: |
              tolower($1) == "power supply" { $5 = "Model: " $5; $6 = "SerialNumber: " $6; print }
      mapping:
        # InstanceTable = Source(1)
        source: ${source::source(1)}
        attributes:
          id: $2
          info: ${awk::join(" ", $9, $6, $5)}
          hw.parent.type: enclosure
          hw.parent.id: IPMI
          name: $2
    collect:
      # Collect type is: multi-instance
      type: multiInstance
      sources:
        source(1):
          # Source(1) = copy of Enclosure.Collect.Source(1)
          type: copy
          from: ${source::monitors.enclosure.collect.sources.source(1)}
          computes:
            # Keep only power supply lines
            # Power supply;DeviceID;Entity ID;Vendor;Model;SerialNumber;StatusArray;StatusInformation
          - type: keepOnlyMatchingLines
            column: 1
            valueList: Power supply
            # Convert StatusArray to a simple (unique) PATROLStatus
            # Power supply;DeviceID;Entity ID;Vendor;Model;SerialNumber;Status;StatusInformation
          - type: convert
            column: 7
            conversion: array2SimpleStatus
      mapping:
        # ValueTable = Source(1)
        source: ${source::source(1)}
        attributes:
          id: $2
        metrics:
          hw.status{hw.type="power_supply"}: $7
        legacyTextParameters:
          StatusInformation: $8
