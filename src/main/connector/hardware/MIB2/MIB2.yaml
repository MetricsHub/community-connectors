---
extends:
- ../../semconv/Hardware
- ../MIB2-header/MIB2-header
connector:
  displayName: MIB-2 Standard SNMP Agent - Network Interfaces
  platforms: SNMP
  detection:
    appliesTo:
    - Network
    - OOB
    - HP
    - Storage
    - VMS
    - OSF1
    supersedes:
    - HPUXNetwork
    tags: [ hardware, network, hp-ux, storage ]
monitors:
  network:
    discovery:
      sources:
        source(3):
          computes:
            # When the port has no ifXTable row (blank ifXTable index in column 7), use the ifTable Description
            # PortID;Description;PortType;MacAddress;AdminStatus;bandwidth;ID;Name;Alias;
          - type: awk
            output: table
            script: |
              $7 == "" { $7 = $2 }
              { print }
      mapping:
        # InstanceTable = Source(1)
        # PortID;Description;PortType;MacAddress;AdminStatus;bandwidth;ID;Name;Alias;
        source: ${source::source(3)}
        attributes:
          id: $1
          __display_id: $8
          physical_address: $4
          physical_address_type: MAC
          device_type: $3
          hw.parent.type: enclosure
          name: ${awk::sprintf("%s (%s)", $7, $3)}
          hw.network.name: $8
          hw.network.alias: $9
