---
extends:
- ../../semconv/Hardware
connector:
  displayName: lm_sensors
  platforms: Linux
  reliesOn: lm_sensors
  information: This connector enables the monitoring of environment sensors on Linux, through the sensors command.
  version: 1.1
  detection:
    connectionTypes:
    - remote
    - local
    appliesTo:
    - Linux
    criteria:
    - type: deviceType
      keep:
      - Linux
    - type: commandLine
      commandLine: "%{SUDO:/usr/bin/sensors} /usr/bin/sensors -h"
      expectedResult: "Usage: sensors "
      errorMessage: lm_sensors is not installed on this server.
    onLastResort: temperature
    tags: [ hardware, linux ]
sudoCommands:
- /usr/sbin/dmidecode
- /usr/bin/sensors
monitors:
  enclosure:
    discovery:
      sources:
        source(1):
          # Discovery Enclosure
          type: commandLine
          commandLine: "%{SUDO:/usr/sbin/dmidecode} /usr/sbin/dmidecode -t system"
          computes:
          # "MSHW";"Manufacturer";"Type";"SN" (MSHW: constant key to join the BIOS row of source(2))
          - type: awk
            script: ${file::enclosureDiscovery1.awk}
            output: table
        source(2):
          type: commandLine
          commandLine: "%{SUDO:/usr/sbin/dmidecode} /usr/sbin/dmidecode -t bios"
          computes:
          # "MSHW";"Bios Info" (MSHW: constant key to join source(1))
          - type: awk
            script: ${file::enclosureDiscovery2.awk}
            output: table
        source(3):
          # "MSHW";"Manufacturer";"Type";"SN";"MSHW";"Bios Info"
          type: tableJoin
          leftTable: ${source::monitors.enclosure.discovery.sources.source(1)}
          rightTable: ${source::monitors.enclosure.discovery.sources.source(2)}
          leftKeyColumn: 1
          rightKeyColumn: 1
      mapping:
        # Enclosure Instance Table
        # "MSHW";"Manufacturer";"Type";"SN";"MSHW";"Bios Info"
        source: ${source::monitors.enclosure.discovery.sources.source(3)}
        attributes:
          id: Computer
          __display_id: $3
          vendor: $2
          type: Computer
          serial_number: $4
          bios_version: $6
  temperature:
    keys:
    - id
    discovery:
      sources:
        source(1):
          # Discovery Temperature
          type: commandLine
          commandLine: "%{SUDO:/usr/bin/sensors} /usr/bin/sensors -u -A"
          computes:
          - type: awk
            script: ${file::temperature.awk}
            output: table
      mapping:
        # Temperature Instance Table
        # "Name";"Type";"Value";"Max";"Critical"
        source: ${source::monitors.temperature.discovery.sources.source(1)}
        attributes:
          id: $1
          __display_id: $1
          hw.parent.type: enclosure
          hw.parent.id: Computer
          name: $1
        metrics:
          hw.temperature.limit{limit_type="high.degraded"}: $4
          hw.temperature.limit{limit_type="high.critical"}: $5
    collect:
      # Collection Type
      type: multiInstance
      sources:
        source(1):
          type: commandLine
          commandLine: "%{SUDO:/usr/bin/sensors} /usr/bin/sensors -u -A"
          computes:
          - type: awk
            script: ${file::temperature.awk}
            output: table
      mapping:
        # Temperature Value Table
        # "Name";"Type";"Value";"Max";"Critical"
        source: ${source::monitors.temperature.collect.sources.source(1)}
        attributes:
          id: $1
        metrics:
          hw.temperature: $3
  voltage:
    keys:
    - id
    discovery:
      sources:
        source(1):
          # Discovery Voltage
          type: commandLine
          commandLine: "%{SUDO:/usr/bin/sensors} /usr/bin/sensors -A"
          computes:
          - type: awk
            script: "${file::voltage.awk}"
            output: table
      mapping:
        # Voltage Instance Table
        # "Name";"Type";"Value";"Lower";"Upper"
        source: ${source::monitors.voltage.discovery.sources.source(1)}
        attributes:
          id: $1
          __display_id: $1
          sensor_location: Planar
          hw.parent.type: enclosure
          hw.parent.id: Computer
          name: ${awk::sprintf("%s (%s)", $1, "Planar")}
        metrics:
          hw.voltage.limit{limit_type="low.critical"}: milliVolt2Volt($4)
          hw.voltage.limit{limit_type="high.critical"}: milliVolt2Volt($5)
    collect:
      # Collection Type
      type: multiInstance
      sources:
        source(1):
          type: commandLine
          commandLine: "%{SUDO:/usr/bin/sensors} /usr/bin/sensors -A"
          computes:
          - type: awk
            script: ${file::voltage.awk}
            output: table
      mapping:
        # Voltage Value Table
        # "Name";"Type";"Value";"Lower";"Upper"
        source: ${source::monitors.voltage.collect.sources.source(1)}
        attributes:
          id: $1
        metrics:
          hw.voltage: milliVolt2Volt($3)
  fan:
    keys:
    - id
    discovery:
      sources:
        source(1):
          # Discovery FAN
          type: commandLine
          commandLine: "%{SUDO:/usr/bin/sensors} /usr/bin/sensors -u -A"
          computes:
          - type: awk
            script: ${file::fan.awk}
            output: table
      mapping:
        # FAN Instance Table
        # "DName-FName";"Value";"Min";"Max";"Alarm"
        source: ${source::monitors.fan.discovery.sources.source(1)}
        attributes:
          id: $1
          __display_id: $1
          sensor_location: Planar
          hw.parent.type: enclosure
          hw.parent.id: Computer
          name: ${awk::sprintf("%s (%s)", $1, "Planar")}
        metrics:
          # fanN_min is the speed below which lm-sensors raises its alarm (fanN_max is a speed, fanN_alarm a flag)
          hw.fan.speed.limit{limit_type="low.critical"}: $3
    collect:
      # Collection Type
      type: multiInstance
      sources:
        source(1):
          type: commandLine
          commandLine: "%{SUDO:/usr/bin/sensors} /usr/bin/sensors -u -A"
          computes:
          - type: awk
            script: ${file::fan.awk}
            output: table
      mapping:
        # FAN Value Table
        # "DName-FName";"Value";"Min";"Max";"Alarm"
        source: ${source::monitors.fan.collect.sources.source(1)}
        attributes:
          id: $1
        metrics:
          hw.fan.speed: $2
